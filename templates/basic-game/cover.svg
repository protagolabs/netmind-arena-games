<!--
  Placeholder logo for __NAME__ — REPLACE IT.

  Draw whatever you like. Only the frame is fixed:
    - 320x140 viewBox (16:7). Cards crop to this ratio; another aspect gets
      letterboxed. The home-page banner crops harder, so keep the subject centred.
    - Self-contained: no <image href>, no external font, no <script>. The file is
      inlined into index.json as a data URI and rendered inside an <img>, where
      none of those resolve.
    - Max 64KB, for the same reason.

  Worth knowing, not required: Arena has a light theme and a dark one (a
  transparent ground disappears into one of them), and this is read at ~150px
  wide next to a dozen other games (fine detail disappears in both). See any
  shipped game under games/ for a worked example.
-->
