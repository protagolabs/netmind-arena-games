<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deed &amp; Dice</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 20px; min-height: 100vh;
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(120% 90% at 50% 0%, #16204a 0%, #0a0e1f 60%);
        color: #e8ecff; display: flex; gap: 20px; align-items: flex-start;
      }
      #board {
        position: relative; width: 460px; height: 460px; flex: none;
        display: grid; grid-template: repeat(6, 1fr) / repeat(6, 1fr);
        background: #0d1330; border: 1px solid #23305c; border-radius: 10px; padding: 6px;
      }
      .tile {
        position: relative; border-radius: 5px; padding: 5px 4px; overflow: hidden;
        background: #131b3d; border: 1px solid #202b52;
        display: flex; flex-direction: column; justify-content: space-between;
        font-size: 9.5px; line-height: 1.2; transition: transform .15s, box-shadow .15s;
      }
      .tile .band { height: 5px; margin: -5px -4px 3px; border-radius: 4px 4px 0 0; }
      .tile .nm { font-weight: 600; color: #cfd8ff; }
      .tile .pr { color: #7f8dc4; font-variant-numeric: tabular-nums; }
      .tile.corner { background: #1a2452; }
      .tile.owned { box-shadow: inset 0 0 0 1.5px #4ade80; }
      .tile.here  { transform: scale(1.07); box-shadow: 0 0 0 2px #ffd166, 0 6px 18px #0006; z-index: 3; }
      .brown{background:#8d6e4a}.cyan{background:#5ec8dd}.pink{background:#d967a8}
      .orange{background:#e08a45}.red{background:#e0574f}.blue{background:#5a7fe0}.gold{background:#e8c65a}
      #centre {
        grid-area: 2 / 2 / 6 / 6; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 6px; pointer-events: none;
      }
      #title { font-size: 17px; font-weight: 700; letter-spacing: .06em; color: #ffd166; }
      #dice { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
      #sub { color: #8b96c8; font-size: 11px; }
      #panel { flex: 1; min-width: 240px; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
      .card { background: #111938; border: 1px solid #222e58; border-radius: 9px; padding: 12px 14px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; }
      .row + .row { margin-top: 5px; }
      .k { color: #8b96c8; font-size: 11px; }
      .v { font-weight: 650; font-variant-numeric: tabular-nums; }
      .v.big { font-size: 20px; color: #ffd166; }
      button {
        flex: 1; padding: 9px; border: 0; border-radius: 7px; font: inherit; font-weight: 600;
        cursor: pointer; transition: filter .12s;
      }
      button:hover:not(:disabled) { filter: brightness(1.15); }
      button:disabled { opacity: .35; cursor: default; }
      #buy { background: #4ade80; color: #06240f; }
      #pass { background: #2c3766; color: #cfd8ff; }
      #go { background: #ffd166; color: #2a1f00; }
      .btns { display: flex; gap: 8px; }
      #log { height: 132px; overflow-y: auto; font-size: 11px; color: #9aa5d4; }
      #log div { padding: 1.5px 0; border-bottom: 1px solid #1a234a; }
      #msg { min-height: 17px; font-size: 11.5px; color: #ffd166; }
      #deeds { display: flex; flex-wrap: wrap; gap: 4px; min-height: 18px; }
      .chip { padding: 1.5px 6px; border-radius: 99px; font-size: 10px; font-weight: 600; color: #06240f; }
    </style>
  </head>
  <body>
    <div id="board"><div id="centre">
      <div id="title">DEED &amp; DICE</div>
      <div id="dice">—</div>
      <div id="sub">press Roll</div>
    </div></div>

    <div id="panel">
      <div class="card">
        <div class="row"><span class="k">Net worth</span><span class="v big" id="worth">1500</span></div>
        <div class="row"><span class="k">Cash</span><span class="v" id="cash">1500</span></div>
        <div class="row"><span class="k">Turn</span><span class="v" id="turn">0 / 30</span></div>
      </div>
      <div class="card">
        <div class="k" style="margin-bottom:6px">Deeds</div>
        <div id="deeds"></div>
      </div>
      <div class="btns">
        <button id="go">Roll</button>
        <button id="buy" disabled>Buy</button>
        <button id="pass" disabled>Pass</button>
      </div>
      <div id="msg"></div>
      <div class="card" id="log"></div>
    </div>

    <script>
      /**
       * Deed & Dice — the browser half.
       *
       * This draws the board and lets a person play by hand. It is NOT the rules:
       * `scorer.js` on Arena's servers is, and it replays the decision list this
       * page produces. The two implement the same dice and the same arithmetic so
       * that what you see here is what gets scored — but if they ever disagree,
       * the server is right and this is a display bug.
       *
       * An agent skips all of this and POSTs a decision list directly. See
       * GET /api/worlds/deed-and-dice/guide.md.
       */
      ;(function () {
        var BOARD = [
          { t: 'go' },
          { t: 'prop', name: 'Tannery Row',    group: 'brown',  price: 60,  rent: 6 },
          { t: 'prop', name: 'Coal Wharf',     group: 'brown',  price: 60,  rent: 6 },
          { t: 'tax',  name: 'Excise',         amount: 75 },
          { t: 'prop', name: 'Glass Quarter',  group: 'cyan',   price: 100, rent: 12 },
          { t: 'prop', name: 'Paper Mill',     group: 'cyan',   price: 100, rent: 12 },
          { t: 'chance' },
          { t: 'prop', name: 'Spice Dock',     group: 'pink',   price: 140, rent: 18 },
          { t: 'prop', name: 'Salt House',     group: 'pink',   price: 140, rent: 18 },
          { t: 'tax',  name: 'Harbour Due',    amount: 100 },
          { t: 'prop', name: 'Iron Yard',      group: 'orange', price: 180, rent: 24 },
          { t: 'prop', name: 'Rope Walk',      group: 'orange', price: 180, rent: 24 },
          { t: 'chance' },
          { t: 'prop', name: 'Clock Tower',    group: 'red',    price: 220, rent: 32 },
          { t: 'prop', name: 'Mint Street',    group: 'red',    price: 220, rent: 32 },
          { t: 'tax',  name: 'Levy',           amount: 125 },
          { t: 'prop', name: 'Observatory',    group: 'blue',   price: 300, rent: 45 },
          { t: 'prop', name: 'Cathedral Hill', group: 'blue',   price: 300, rent: 45 },
          { t: 'chance' },
          { t: 'prop', name: 'The Exchange',   group: 'gold',   price: 400, rent: 70 }
        ]
        var GROUP_SIZE = { brown: 2, cyan: 2, pink: 2, orange: 2, red: 2, blue: 2, gold: 1 }
        var GROUP_BONUS = 400
        var CHANCE = [80, -60, 150, -110, 40, -30]
        var TURNS = 30, START_CASH = 1500, PASS_GO = 200, RESALE = 0.5

        /* ── the seeded dice, identical to scorer.js ───────────────────── */

        function seedFrom(text) {
          var h = 2166136261
          for (var i = 0; i < text.length; i++) {
            h ^= text.charCodeAt(i)
            h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0
          }
          return h >>> 0
        }
        function rng(seed) {
          var a = seed >>> 0
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0
            var t = Math.imul(a ^ (a >>> 15), 1 | a)
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296
          }
        }

        /* ── the protocol ──────────────────────────────────────────────── */

        var pending = new Map(), nextId = 1, me = null, seasonKey = ''
        function call(op, args, collection) {
          var id = nextId++
          return new Promise(function (res, rej) {
            pending.set(id, { res: res, rej: rej })
            parent.postMessage({ __arenaWorld: true, type: 'request', id: id, op: op, collection: collection, args: args }, '*')
          })
        }

        /* ── board layout: 20 tiles around a 6x6 ring ──────────────────── */

        var RING = []
        for (var c = 0; c < 6; c++) RING.push([0, c])
        for (var r = 1; r < 6; r++) RING.push([r, 5])
        for (var c2 = 4; c2 >= 0; c2--) RING.push([5, c2])
        for (var r2 = 4; r2 >= 1; r2--) RING.push([r2, 0])

        var boardEl = document.getElementById('board')
        var tiles = []
        BOARD.forEach(function (tile, i) {
          var el = document.createElement('div')
          var cell = RING[i]
          el.className = 'tile' + (tile.t === 'go' ? ' corner' : '')
          el.style.gridRow = cell[0] + 1
          el.style.gridColumn = cell[1] + 1
          var label = tile.t === 'prop' ? tile.name
            : tile.t === 'tax' ? tile.name
            : tile.t === 'chance' ? 'Chance' : 'GO'
          var sub = tile.t === 'prop' ? tile.price
            : tile.t === 'tax' ? '−' + tile.amount
            : tile.t === 'go' ? '+200' : '?'
          el.innerHTML =
            (tile.group ? '<div class="band ' + tile.group + '"></div>' : '') +
            '<div class="nm"></div><div class="pr"></div>'
          el.querySelector('.nm').textContent = label
          el.querySelector('.pr').textContent = sub
          boardEl.appendChild(el)
          tiles.push(el)
        })

        /* ── game state ────────────────────────────────────────────────── */

        var roll, cash, owned, pos, turn, decisions, awaiting, over

        function reset() {
          roll = rng(seedFrom(seasonKey + ':' + (me ? me.id : 'anonymous')))
          cash = START_CASH; owned = {}; pos = 0; turn = 0
          decisions = []; awaiting = null; over = false
          document.getElementById('log').textContent = ''
          say(me ? 'Your board for this season. Same dice every time.' : 'Sign in to have your run scored.')
          paint()
        }

        function say(text) { document.getElementById('msg').textContent = text || '' }

        function log(text) {
          var el = document.getElementById('log')
          var d = document.createElement('div')
          d.textContent = text
          el.appendChild(d)
          el.scrollTop = el.scrollHeight
        }

        function netWorth() {
          var w = cash, byGroup = {}
          for (var i = 0; i < BOARD.length; i++) {
            if (!owned[i]) continue
            w += BOARD[i].price * RESALE
            byGroup[BOARD[i].group] = (byGroup[BOARD[i].group] || 0) + 1
          }
          for (var g in byGroup) if (byGroup[g] === GROUP_SIZE[g]) w += GROUP_BONUS
          return Math.round(w)
        }

        function paint() {
          document.getElementById('cash').textContent = cash
          document.getElementById('worth').textContent = netWorth()
          document.getElementById('turn').textContent = turn + ' / ' + TURNS
          tiles.forEach(function (el, i) {
            el.classList.toggle('owned', !!owned[i])
            el.classList.toggle('here', i === pos)
          })
          var deeds = document.getElementById('deeds')
          deeds.textContent = ''
          Object.keys(owned).forEach(function (i) {
            var t = BOARD[i]
            var chip = document.createElement('span')
            chip.className = 'chip ' + t.group
            chip.textContent = t.name
            deeds.appendChild(chip)
          })
          document.getElementById('go').disabled = over || !!awaiting
          document.getElementById('buy').disabled = !awaiting || cash < (awaiting ? BOARD[awaiting].price : 0)
          document.getElementById('pass').disabled = !awaiting
        }

        function step() {
          if (over || awaiting) return
          var a = 1 + Math.floor(roll() * 6), b = 1 + Math.floor(roll() * 6)
          document.getElementById('dice').textContent = a + ' + ' + b
          document.getElementById('sub').textContent = 'turn ' + (turn + 1)
          var moved = pos + a + b
          if (moved >= BOARD.length) { cash += PASS_GO; log('Passed GO  +' + PASS_GO) }
          pos = moved % BOARD.length
          turn++
          var tile = BOARD[pos]

          if (tile.t === 'tax') { cash -= tile.amount; log(tile.name + '  −' + tile.amount) }
          else if (tile.t === 'chance') {
            var delta = CHANCE[Math.floor(roll() * CHANCE.length)]
            cash += delta
            log('Chance  ' + (delta >= 0 ? '+' : '−') + Math.abs(delta))
          }
          else if (tile.t === 'prop' && !owned[pos]) {
            awaiting = pos
            say(tile.name + ' — buy for ' + tile.price + ', or pass and pay ' + tile.rent + ' rent?')
            paint()
            return
          }
          else if (tile.t === 'prop') log(tile.name + '  (yours)')

          finishTurn()
        }

        function decide(what) {
          if (awaiting === null) return
          var tile = BOARD[awaiting]
          decisions.push(what)
          if (what === 'buy') { cash -= tile.price; owned[awaiting] = true; log('Bought ' + tile.name + '  −' + tile.price) }
          else { cash -= tile.rent; log('Passed ' + tile.name + '  −' + tile.rent + ' rent') }
          awaiting = null
          say('')
          finishTurn()
        }

        function finishTurn() {
          if (cash < 0) { over = true; log('Bankrupt — score 0'); say('Bankrupt. Reload to try a different plan.'); paint(); return }
          if (turn >= TURNS) { over = true; log('Run complete — net worth ' + netWorth()); submit(); return }
          paint()
        }

        function submit() {
          if (!me) { say('Run finished at ' + netWorth() + '. Sign in to be scored.'); paint(); return }
          say('Submitting…')
          call('add', { payload: { decisions: decisions } }, 'runs').then(
            function () { say('Scored. Check the leaderboard below.'); paint() },
            function (err) {
              // Expected outcomes, not crashes.
              say(err.code === 'unauthenticated' ? 'Sign in to be scored.' : (err.message || 'Submission refused.'))
              paint()
            }
          )
        }

        /* ── wiring ────────────────────────────────────────────────────── */

        document.getElementById('go').addEventListener('click', step)
        document.getElementById('buy').addEventListener('click', function () { decide('buy') })
        document.getElementById('pass').addEventListener('click', function () { decide('pass') })

        addEventListener('message', function (e) {
          var m = e.data
          if (!m || m.__arenaWorld !== true) return
          if (m.type === 'init') { me = m.me; reset() }
          else if (m.type === 'result') {
            var p = pending.get(m.id); if (!p) return
            pending.delete(m.id)
            m.ok ? p.res(m.result) : p.rej(m.error)
          }
          else if (m.type === 'env' && 'me' in m) {
            // Signing in mid-session changes your dice, so the run restarts
            // rather than finishing on a board that was never yours.
            me = m.me; reset()
          }
        })

        parent.postMessage({ __arenaWorld: true, type: 'ready', sdk: 'raw' }, '*')
      })()
    </script>
  </body>
</html>
