name: games-ci

# PR gate for BOTH submission tracks — games/ and worlds/. External authors and
# agents open PRs here; this must pass (plus CODEOWNERS review) before merge. The
# Arena backend is never touched by contributors.
#
# The two tracks are gated on different things, because they are trusted
# differently: a game's output becomes credits, so it is checked for determinism;
# a world's output is unscored, so it is checked for a self-contained build,
# storage caps and schema-version continuity. `pnpm validate` runs both.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          # Matches package.json `engines.node`. Running CI a major version below
          # what the repo declares means every author develops against a runtime
          # the gate never exercises.
          node-version: 22
          cache: pnpm
      - name: Install deps
        # Prefer the committed lockfile for reproducibility. But an external game
        # PR adds a new games/<slug> workspace member, which needs a new lockfile
        # importer entry — and path-guard blocks external authors from committing
        # root files like pnpm-lock.yaml. When that's the only reason the lockfile
        # is stale, regenerate it in-job (NOT committed) so the game can still be
        # validated. The fallback reuses existing pinned resolutions and only adds
        # the missing importer, so already-locked deps stay pinned.
        #
        # The fallback is what makes install lifecycle scripts worth thinking
        # about: a submission PR may freely edit games/<slug>/package.json and
        # worlds/<slug>/package.json (path-guard stops infra edits, not dependency
        # edits), so a PR can name any dependency and the non-frozen path will
        # fetch it. Root package.json's `pnpm.onlyBuiltDependencies` allowlists
        # which packages may run scripts at all, so that fetch is not also a
        # code-execution primitive handed out before any gate has run.
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Typecheck (SDK + all games)
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm -r test
      - name: Validate games + worlds
        # games: manifest ↔ meta, source scan, determinism/termination sweep
        # worlds: manifest schema, storage caps, self-contained build, no network
        run: pnpm validate
