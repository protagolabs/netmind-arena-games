name: publish

# On merge to main: build content-hash-pinned bundles + index.json and publish
# them as a GitHub Release. The Arena backend pulls the artifacts from the release
# (never the source) via:
#   ARENA_GAMES_INDEX=https://github.com/<owner>/<repo>/releases/latest/download/index.json
#
# No AWS/secret needed — uses the built-in GITHUB_TOKEN. Each merge cuts a new
# release (history + rollback); `make_latest` keeps the /latest/download/ URL fresh.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build bundles + index.json
        run: pnpm build:bundles
      - name: Flatten into release assets
        run: pnpm pack:release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: games-${{ github.run_number }}
          name: Arena games (build ${{ github.run_number }})
          make_latest: true
          files: release/*
          body: |
            Content-hash-pinned game bundles + `index.json`.

            Backend loads the latest via:
            `ARENA_GAMES_INDEX=https://github.com/${{ github.repository }}/releases/latest/download/index.json`
